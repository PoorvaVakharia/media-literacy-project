<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNovels</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="marquee-scroll">   
    <marquee scrollamount = "13"; direction = "left"; style="position: fixed; top: 0; left: 0; width: 100%; background: #7445ae; color: #fff; padding: 10px; z-index: 9999;">
    <h1>
    <i>
    Welcome to KNovels!
    </i>
    </h1>
    </marquee>
    <br>
</div>

<h1>Meet someone new, learn something new.</h1>

    <div class="sign-in"><form id="loginForm">
        <h2>
            If you've got an account already...
        </h2>
        <label for="email">Email</label>
        <input 
        type="email" 
        id="si_email" 
        name="si_email" 
        placeholder="Email..."
        required
        >
        <br>
        <label for="password">Password</label>
        <input 
        type="password" 
        id="si_pwd" 
        name="si_pwd" 
        placeholder="Password..."
        required
        >
        <br>
        
        <button type="submit" id="sign-in-btn">Sign In!</button>
        <br>
    </form></div>

    <!--    MUTED FOR NOW
    <div class="google-login">
        <br>
        <label for="email">Or log in with your school email...</label>
        <br>
        <button id="sign-in-btn">Sign in with Google</button>
    </div>
    -->

    <br>
    <h2>
        Don't have an account?
    </h2>
    <button id="sign-up-btn">Sign Up!</button>

    <script type="module" src="js/app.js"></script>
</body>
</html>
