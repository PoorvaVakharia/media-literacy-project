<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNovels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Nice to meet you! Let's start analyzing academic texts, together!</h1>
    <br>
    <br>
  <div class="sign-in"><form id="signUpForm">
        <label for="email">Email</label>
        <input 
        type="email" 
        id="su_email" 
        name="su_email" 
        placeholder="Email..."
        required
        >
        <br>
        <label for="password">Password</label>
        <input 
        type="password" 
        id="su_pwd" 
        name="su_pwd" 
        placeholder="Password..."
        required
        >
        <br>
        <label for="password">Retype Password</label>
        <input 
        type="password" 
        id="su_pwd_check" 
        name="su_pwd_check" 
        placeholder="Password..."
        required
        >
        <br>
        
        <button type="submit"; id="sign-up-btn">Join Us!</button>
        <br>
    </div></form>
    <script src="signUp.js"></script>


</body>
</html>
