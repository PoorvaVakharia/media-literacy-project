<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | KNovels</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Nice to meet you! Let's start analyzing academic texts, together!</h1>

    <br><br>

    <div class="sign-in">

        <form id="signUpForm">

            <!-- Name -->
            <label for="su_name">Your Name</label>
            <input
                type="text"
                id="su_name"
                name="su_name"
                placeholder="What should we call you?"
                required
            >

            <br>

            <!-- Email -->
            <label for="su_email">Email</label>
            <input
                type="email"
                id="su_email"
                name="su_email"
                placeholder="Email..."
                required
            >

            <br>

            <!-- Password -->
            <label for="su_pwd">Password</label>
            <input
                type="password"
                id="su_pwd"
                name="su_pwd"
                placeholder="Password..."
                required
            >

            <br>

            <!-- Confirm Password -->
            <label for="su_pwd_check">Retype Password</label>
            <input
                type="password"
                id="su_pwd_check"
                name="su_pwd_check"
                placeholder="Retype your password..."
                required
            >

            <br><br>

            <!-- Sign Up Button -->
            <button type="submit" id="sign-up-btn">
                Join Us!
            </button>

            <br><br>

            <!-- Back to Sign In -->
            <p>Already have an account?</p>

            <a href="../index.html" class="auth-link">
                Back to Sign In
            </a>

        </form>

    </div>

    <script src="../js/signUp.js"></script>

</body>

</html>
