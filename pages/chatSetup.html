<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a reading | KNovels</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main>
        <h1>Discuss a reading</h1>
        <p>Choose a PDF. Anyone choosing the exact same file joins the same discussion room.</p>
        <p>Your PDF stays on your device. Different exports or editions may create different rooms.</p>
        <label for="pdfInput">Reading PDF (up to 25 MB)</label>
        <input type="file" id="pdfInput" accept="application/pdf,.pdf">
        <p id="status" role="status">Choose a PDF to find its discussion room.</p>
        <iframe id="pdfPreview" title="Preview of your selected reading" style="width:100%;height:400px" hidden></iframe>
        <p><a id="joinChat" hidden>Join this reading’s discussion</a></p>
        <p><a href="chooseText.html">Back to discussion options</a></p>
    </main>
    <script type="module" src="../js/chatSetup.js"></script>
</body>
</html>
