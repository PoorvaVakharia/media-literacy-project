<html lang="en">
<head>

<h1>New chat created!</h1>
<h3>Discussion partner found. Please be aware of sharing personal details and follow our Terms of Service.</h3>

<div id="status"></div>

  <h2>Upload and View PDF</h2>
  
  <!-- 1. Simple File Input (Only allows PDFs) -->
  <input type="file" id="pdfInput" accept="application/pdf" />

  <br><br>

  <!-- 2. Container where the PDF will be shown -->
  <iframe id="pdfPreview" style="width:100%; height:300px; display:none;"></iframe>

  <script>
    const pdfInput = document.getElementById('pdfInput');
    const pdfPreview = document.getElementById('pdfPreview');

    // 3. Listen for when a user chooses a file
    pdfInput.addEventListener('change', (event) => {
      const file = event.target.files[0]; // Get the selected file
      
      if (file) {
      // Optional: Validate that the file is a PDF
      if (file.type !== 'application/pdf') {
        alert('Please upload a PDF file.');
        return;
      }

      // Create temporary URL for the PDF
      const fileUrl = URL.createObjectURL(file);
      // Point the iframe to that link and make it visible
       // pdfPreview.src = fileUrl;
        //pdfPreview.style.display = 'block';

      // Redirect to another page
      window.location.href = 'chat.html';
    }
  });
  </script>

</body>
</html>
